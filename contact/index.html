<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — CV</title>
  <link rel="icon" href="/brand_assets/CV_logo_single.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F4F2;
      --ink: #222222;
      --ink-60: rgba(34,34,34,0.6);
      --ink-35: rgba(34,34,34,0.35);
      --ink-12: rgba(34,34,34,0.12);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Instrument Sans', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Grain overlay ── */
    #grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.04;
      width: 100%; height: 100%;
    }

    /* ── Navigation ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      padding: 30px 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      mix-blend-mode: multiply;
      opacity: 0;
      animation: slideDown 0.5s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }

    .nav-wordmark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 44px;
      list-style: none;
    }

    .nav-links a {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-60);
      text-decoration: none;
      position: relative;
      transition: color 0.25s ease;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0; bottom: -3px;
      width: 0; height: 1px;
      background: var(--ink);
      transition: width 0.3s cubic-bezier(0.16,1,0.3,1);
    }

    .nav-links a:hover { color: var(--ink); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--ink); }
    .nav-links a.active::after { width: 100%; }

    /* ── Main content ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 140px 52px 100px;
    }

    .contact-wrap {
      width: 100%;
      max-width: 680px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeRise 0.75s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-35);
      margin-bottom: 32px;
    }

    .page-heading {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(40px, 6vw, 76px);
      letter-spacing: -0.03em;
      line-height: 1.0;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .page-sub {
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-60);
      margin-bottom: 64px;
    }

    /* ── Form ── */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-35);
    }

    .field input,
    .field textarea {
      width: 100%;
      background: var(--bg);
      border: none;
      border-bottom: 1px solid var(--ink-12);
      padding: 14px 0;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: var(--ink);
      outline: none;
      transition: border-color 0.25s ease;
      resize: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--ink-35);
    }

    .field input:focus,
    .field textarea:focus {
      border-bottom-color: var(--ink);
    }

    .field textarea {
      min-height: 120px;
      line-height: 1.7;
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 17px 38px;
      background: var(--ink);
      color: var(--bg);
      font-family: 'Instrument Sans', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.16,1,0.3,1);
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(245,244,242,0.12);
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
    }

    .btn-primary:hover::before { transform: translateX(0); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* ── Hairline ── */
    .hairline {
      width: calc(100% - 104px);
      margin: 0 auto;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--ink-12) 20%, var(--ink-12) 80%, transparent);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--ink-12);
      padding: 36px 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      font-size: 11.5px;
      color: var(--ink-35);
      letter-spacing: 0.06em;
    }

    .footer-nav {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .footer-nav a {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-35);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-nav a:hover { color: var(--ink); }

    /* ── Thank-you state ── */
    .thankyou-block {
      opacity: 0;
      transform: translateY(24px);
      animation: fadeRise 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* ── Keyframes ── */
    @keyframes fadeRise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      nav { padding: 24px 28px; }
      .nav-links { gap: 28px; }
      main { padding: 120px 28px 80px; }
      footer { padding: 32px 28px; flex-direction: column; gap: 20px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- ── Grain overlay ── -->
  <svg id="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>

  <!-- ── Nav ── -->
  <nav>
    <a href="/" class="nav-wordmark">Cristian Victoria</a>
    <ul class="nav-links">
      <li><a href="/about/">About</a></li>
      <li><a href="/contact/" class="active">Contact</a></li>
    </ul>
  </nav>

  <!-- ── Main ── -->
  <main>
    <div class="contact-wrap">
      <p class="eyebrow">Get in Touch</p>
      <h1 class="page-heading">Let's talk.</h1>
      <p class="page-sub">Fill in the form below and I'll get back to you.</p>

      <form class="contact-form" action="https://formspree.io/f/mkolbjwe" method="POST">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Tell me what's on your mind." required></textarea>
        </div>

        <div class="form-footer">
          <button type="submit" class="btn-primary">
            Send Message
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
              <path d="M1 5h12M8 1l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>

      <div id="thankyou" style="display:none;" class="thankyou-block">
        <p class="eyebrow">Message Sent</p>
        <h1 class="page-heading">Thank you.</h1>
        <p class="page-sub">Thank you very much. I'll respond as soon as I can.</p>
      </div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer>
    <span class="footer-left">© 2026 Cristian Victoria</span>
    <ul class="footer-nav">
      <li><a href="https://www.linkedin.com/in/cristianvictoria/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      <li><a href="https://github.com/cristian-victoria" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    </ul>
  </footer>

  <script>
    document.querySelector('.contact-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = new FormData(form);

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          document.querySelector('.eyebrow').style.display = 'none';
          document.querySelector('.page-heading').style.display = 'none';
          document.querySelector('.page-sub').style.display = 'none';
          form.style.display = 'none';
          document.getElementById('thankyou').style.display = 'block';
        }
      } catch (_) {}
    });
  </script>
</body>
</html>
