<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Cristian Victoria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F4F2;
      --ink: #222222;
      --ink-60: rgba(34,34,34,0.6);
      --ink-35: rgba(34,34,34,0.35);
      --ink-12: rgba(34,34,34,0.12);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Instrument Sans', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Grain overlay ── */
    #grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.04;
      width: 100%; height: 100%;
    }

    /* ── Navigation ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      padding: 30px 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      mix-blend-mode: multiply;
      opacity: 0;
      animation: slideDown 0.5s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }

    .nav-wordmark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 44px;
      list-style: none;
    }

    .nav-links a {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-60);
      text-decoration: none;
      position: relative;
      transition: color 0.25s ease;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0; bottom: -3px;
      width: 0; height: 1px;
      background: var(--ink);
      transition: width 0.3s cubic-bezier(0.16,1,0.3,1);
    }

    .nav-links a:hover { color: var(--ink); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--ink); }
    .nav-links a.active::after { width: 100%; }

    /* ── Layout ── */
    main { flex: 1; padding-top: 120px; }

    .section-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 52px;
    }

    /* ── Hairline ── */
    .hairline {
      width: calc(100% - 104px);
      margin: 0 auto;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--ink-12) 20%, var(--ink-12) 80%, transparent);
    }

    /* ── Page header ── */
    .page-header {
      padding: 64px 0 72px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeRise 0.75s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
    }

    .eyebrow {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-35);
      margin-bottom: 20px;
    }

    .page-heading {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(36px, 5vw, 68px);
      letter-spacing: -0.03em;
      line-height: 1.0;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .page-meta {
      font-size: 13px;
      color: var(--ink-35);
      letter-spacing: 0.08em;
    }

    /* ── Filter tabs ── */
    .filter-wrap {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeRise 0.65s cubic-bezier(0.16,1,0.3,1) 0.52s forwards;
    }

    .filter-row {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--ink-12);
    }

    .filter-btn {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-35);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 16px 20px;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .filter-btn:first-child { padding-left: 0; }
    .filter-btn:hover { color: var(--ink); }
    .filter-btn.active { color: var(--ink); border-bottom-color: var(--ink); }

    /* ── Writing list ── */
    .list-wrap {
      padding: 0 0 140px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeRise 0.7s cubic-bezier(0.16,1,0.3,1) 0.64s forwards;
    }

    .writing-list {
      display: flex;
      flex-direction: column;
    }

    .writing-item {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      align-items: start;
      gap: 48px;
      padding: 32px 0;
      border-bottom: 1px solid var(--ink-12);
      text-decoration: none;
      color: inherit;
      transition: padding-left 0.3s cubic-bezier(0.16,1,0.3,1);
    }

    .writing-item:first-child { border-top: 1px solid var(--ink-12); }
    .writing-item:hover { padding-left: 6px; }

    .writing-date {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--ink-35);
      padding-top: 3px;
    }

    .writing-body { display: flex; flex-direction: column; gap: 6px; }

    .writing-title {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .writing-excerpt {
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink-60);
      font-weight: 400;
    }

    .writing-tag {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-35);
      white-space: nowrap;
      padding-top: 4px;
    }

    .empty-state {
      padding: 72px 0;
      text-align: center;
      color: var(--ink-35);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      display: none;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--ink-12);
      padding: 36px 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      font-size: 11.5px;
      color: var(--ink-35);
      letter-spacing: 0.06em;
    }

    .footer-nav {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .footer-nav a {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-35);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-nav a:hover { color: var(--ink); }

    /* ── Keyframes ── */
    @keyframes fadeRise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      nav { padding: 24px 28px; }
      .nav-links { gap: 28px; }
      .section-inner { padding: 0 28px; }
      .hairline { width: calc(100% - 56px); }
      .writing-item { grid-template-columns: 60px 1fr; gap: 20px; }
      .writing-tag { display: none; }
      footer { padding: 32px 28px; flex-direction: column; gap: 20px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- ── Grain overlay ── -->
  <svg id="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>

  <!-- ── Nav ── -->
  <nav>
    <a href="index.html" class="nav-wordmark">Cristian Victoria</a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="work.html">Work</a></li>
      <li><a href="writing.html" class="active">Writing</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <!-- ── Page header ── -->
    <div class="section-inner">
      <div class="page-header">
        <span class="eyebrow">All Writing</span>
        <h1 class="page-heading">Essays &amp; Ideas</h1>
        <p class="page-meta" id="essay-count">— essays</p>
      </div>
    </div>

    <div class="hairline"></div>

    <div class="section-inner">
      <!-- ── Filter tabs ── -->
      <div class="filter-wrap">
        <div class="filter-row" id="filter-row">
          <button class="filter-btn active" data-tag="all">All</button>
          <button class="filter-btn" data-tag="Technology">Technology</button>
          <button class="filter-btn" data-tag="Strategy">Strategy</button>
          <button class="filter-btn" data-tag="Ideas">Ideas</button>
          <button class="filter-btn" data-tag="Product">Product</button>
        </div>
      </div>

      <!-- ── Writing list ── -->
      <div class="list-wrap">
        <div class="writing-list" id="writing-list"></div>
        <p class="empty-state" id="empty-state">No essays in this category yet.</p>
      </div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer>
    <span class="footer-left">© 2026 Cristian Victoria</span>
    <ul class="footer-nav">
      <li><a href="https://www.linkedin.com/in/cristianvictoria/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      <li><a href="https://github.com/cristian-victoria" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    </ul>
  </footer>

  <script>
    let essays = [];
    let activeTag = 'all';

    fetch('website_content/writing/index.json')
      .then(r => r.json())
      .then(data => {
        essays = data;
        const count = essays.length;
        document.getElementById('essay-count').textContent =
          `${count} essay${count !== 1 ? 's' : ''}`;
        render();
      })
      .catch(() => {
        document.getElementById('essay-count').textContent = '';
        render();
      });

    function render() {
      const list  = document.getElementById('writing-list');
      const empty = document.getElementById('empty-state');
      const items = activeTag === 'all'
        ? essays
        : essays.filter(e => e.tag === activeTag);

      if (items.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      list.innerHTML = items.map(e => `
        <a href="writing/${e.slug}.html" class="writing-item">
          <span class="writing-date">${e.date}</span>
          <span class="writing-body">
            <span class="writing-title">${e.title}</span>
            <span class="writing-excerpt">${e.excerpt}</span>
          </span>
          <span class="writing-tag">${e.tag}</span>
        </a>
      `).join('');
    }

    document.getElementById('filter-row').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTag = btn.dataset.tag;
      render();
    });
  </script>
</body>
</html>
