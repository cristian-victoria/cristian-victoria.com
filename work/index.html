<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VZ73SXQ08M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VZ73SXQ08M');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — CV</title>
  <link rel="icon" href="/brand_assets/CV_logo_single.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F4F2;
      --ink: #222222;
      --ink-60: rgba(34,34,34,0.6);
      --ink-35: rgba(34,34,34,0.35);
      --ink-12: rgba(34,34,34,0.12);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Instrument Sans', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Grain overlay ── */
    #grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.04;
      width: 100%; height: 100%;
    }

    /* ── Navigation ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      padding: 30px 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      mix-blend-mode: multiply;
      opacity: 0;
      animation: slideDown 0.5s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }

    .nav-wordmark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 44px;
      list-style: none;
    }

    .nav-links a {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-60);
      text-decoration: none;
      position: relative;
      transition: color 0.25s ease;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0; bottom: -3px;
      width: 0; height: 1px;
      background: var(--ink);
      transition: width 0.3s cubic-bezier(0.16,1,0.3,1);
    }

    .nav-links a:hover { color: var(--ink); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--ink); }
    .nav-links a.active::after { width: 100%; }

    /* ── Layout ── */
    main { flex: 1; padding-top: 120px; }

    .section-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 52px;
    }

    /* ── Hairline ── */
    .hairline {
      width: calc(100% - 104px);
      margin: 0 auto;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--ink-12) 20%, var(--ink-12) 80%, transparent);
    }

    /* ── Page header ── */
    .page-header {
      padding: 64px 0 72px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeRise 0.75s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
    }

    .eyebrow {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--ink-35);
      margin-bottom: 20px;
    }

    .page-heading {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(36px, 5vw, 68px);
      letter-spacing: -0.03em;
      line-height: 1.0;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .page-meta {
      font-size: 13px;
      color: var(--ink-35);
      letter-spacing: 0.08em;
    }

    /* ── Filter tabs ── */
    .filter-wrap {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeRise 0.65s cubic-bezier(0.16,1,0.3,1) 0.52s forwards;
    }

    .filter-row {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--ink-12);
    }

    .filter-btn {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-35);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 16px 20px;
      cursor: pointer;
      margin-bottom: -1px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .filter-btn:first-child { padding-left: 0; }
    .filter-btn:hover { color: var(--ink); }
    .filter-btn.active { color: var(--ink); border-bottom-color: var(--ink); }

    /* ── Work grid ── */
    .grid-wrap {
      padding: 48px 0 140px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeRise 0.7s cubic-bezier(0.16,1,0.3,1) 0.64s forwards;
    }

    .work-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }

    .work-card {
      position: relative;
      overflow: hidden;
      background: #e2e1de;
      cursor: pointer;
      text-decoration: none;
      display: block;
      min-height: 420px;
    }

    .work-card-placeholder {
      width: 100%;
      height: 100%;
      min-height: 420px;
      display: block;
      transition: transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }

    .work-card:hover .work-card-placeholder { transform: scale(1.04); }

    .work-card-info {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(22,22,22,0.88) 0%, rgba(22,22,22,0.1) 55%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 32px 30px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .work-card:hover .work-card-info { opacity: 1; }

    .work-card-title {
      font-family: 'Syne', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      transform: translateY(8px);
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
    }

    .work-card:hover .work-card-title { transform: translateY(0); }

    .work-card-excerpt {
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255,255,255,0.7);
      margin-bottom: 10px;
      transform: translateY(6px);
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.03s;
      max-width: 360px;
    }

    .work-card:hover .work-card-excerpt { transform: translateY(0); }

    .work-card-type {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      transform: translateY(6px);
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.06s;
    }

    .work-card:hover .work-card-type { transform: translateY(0); }

    .work-card.hidden { display: none; }

    .empty-state {
      padding: 72px 0;
      text-align: center;
      color: var(--ink-35);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      display: none;
      grid-column: span 2;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--ink-12);
      padding: 36px 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      font-size: 11.5px;
      color: var(--ink-35);
      letter-spacing: 0.06em;
    }

    .footer-nav {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .footer-nav a {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-35);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-nav a:hover { color: var(--ink); }

    /* ── Keyframes ── */
    @keyframes fadeRise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      nav { padding: 24px 28px; }
      .nav-links { gap: 28px; }
      .section-inner { padding: 0 28px; }
      .hairline { width: calc(100% - 56px); }
      .work-grid { grid-template-columns: 1fr; }
      footer { padding: 32px 28px; flex-direction: column; gap: 20px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- ── Grain overlay ── -->
  <svg id="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
  </svg>

  <!-- ── Nav ── -->
  <nav>
    <a href="/" class="nav-wordmark">Cristian Victoria</a>
    <ul class="nav-links">
      <li><a href="/about/">About</a></li>
      <li><a href="/work/" class="active">Work</a></li>
      <li><a href="/writing/">Writing</a></li>
      <li><a href="/contact/">Contact</a></li>
    </ul>
  </nav>

  <main>
    <!-- ── Page header ── -->
    <div class="section-inner">
      <div class="page-header">
        <span class="eyebrow">Selected Work</span>
        <h1 class="page-heading">Projects</h1>
        <p class="page-meta" id="project-count">— projects</p>
      </div>
    </div>

    <div class="hairline"></div>

    <div class="section-inner">
      <!-- ── Filter tabs ── -->
      <div class="filter-wrap">
        <div class="filter-row" id="filter-row">
          <button class="filter-btn active" data-tag="all">All</button>
          <button class="filter-btn" data-tag="Data Science">Data Science</button>
          <button class="filter-btn" data-tag="Engineering">Engineering</button>
          <button class="filter-btn" data-tag="Design">Design</button>
        </div>
      </div>

      <!-- ── Work grid ── -->
      <div class="grid-wrap">
        <div class="work-grid" id="work-grid"></div>
      </div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer>
    <span class="footer-left">© 2026 Cristian Victoria</span>
    <ul class="footer-nav">
      <li><a href="https://www.linkedin.com/in/cristianvictoria/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      <li><a href="https://github.com/cristian-victoria" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    </ul>
  </footer>

  <script>
    let projects = [];
    let activeTag = 'all';

    fetch('/website_content/work/index.json')
      .then(r => r.json())
      .then(data => {
        projects = data;
        const count = projects.length;
        document.getElementById('project-count').textContent =
          `${count} project${count !== 1 ? 's' : ''}`;
        render();
      })
      .catch(() => {
        document.getElementById('project-count').textContent = '';
        render();
      });

    function matchesTag(project, tag) {
      if (tag === 'all') return true;
      return project.type.toLowerCase().includes(tag.toLowerCase());
    }

    function render() {
      const grid  = document.getElementById('work-grid');
      const items = projects.filter(p => matchesTag(p, activeTag));

      if (items.length === 0) {
        grid.innerHTML = '<p class="empty-state" style="display:block">No projects in this category yet.</p>';
        return;
      }

      grid.innerHTML = items.map(p => `
        <a href="/work/${p.slug}.html" class="work-card">
          <div class="work-card-placeholder" style="background:${p.gradient}"></div>
          <div class="work-card-info">
            <div class="work-card-title">${p.title}</div>
            <div class="work-card-excerpt">${p.excerpt}</div>
            <div class="work-card-type">${p.type}</div>
          </div>
        </a>
      `).join('');
    }

    document.getElementById('filter-row').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTag = btn.dataset.tag;
      render();
    });
  </script>
</body>
</html>
